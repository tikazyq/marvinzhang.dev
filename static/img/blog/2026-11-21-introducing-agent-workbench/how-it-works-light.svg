<text x="60" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">protects main · blocks CI polling · asks before Opus</text>
<text x="60" y="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">sends questions written as prose back to the question tool</text>
