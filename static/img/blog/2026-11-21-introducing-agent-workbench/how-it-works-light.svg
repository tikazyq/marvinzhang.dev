<text x="470" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="start">brief ↓  report + evidence ↑</text>
