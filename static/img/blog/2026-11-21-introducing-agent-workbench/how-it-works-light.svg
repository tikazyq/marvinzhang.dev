<text x="547" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6270" text-anchor="middle">handover</text>
<rect x="40" y="420" width="810" height="84" rx="8" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="1.5"/>
