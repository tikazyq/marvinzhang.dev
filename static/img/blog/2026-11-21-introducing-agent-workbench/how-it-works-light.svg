<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="How Agent Workbench works: you talk to a Manager session, which sends work to Haiku, Sonnet or Opus Workers and verifies the results, while a policy hook checks every step.">
<title>How Agent Workbench works</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6270"/></marker></defs>
