name: Validate Chinese Blog Formatting

# The checkers and their baselines are in the path filter too: editing a
# validator or a baseline changes what ships just as much as editing a post,
# and without them a change that breaks a check sails through unexercised.
# (GitHub Actions does not expand YAML anchors, so the two lists are duplicated.)
on:
  pull_request:
    paths:
      - 'i18n/zh/docusaurus-plugin-content-blog/**/*.mdx'
      - 'i18n/zh/docusaurus-plugin-content-blog/**/*.md'
      - 'blog/**/*.mdx'
      - 'scripts/validate-*.js'
      - 'scripts/*-baseline.json'
      - '.github/workflows/validate-zh-formatting.yml'
  push:
    branches:
      - main
    paths:
      - 'i18n/zh/docusaurus-plugin-content-blog/**/*.mdx'
      - 'i18n/zh/docusaurus-plugin-content-blog/**/*.md'
      - 'blog/**/*.mdx'
      - 'scripts/validate-*.js'
      - 'scripts/*-baseline.json'
      - '.github/workflows/validate-zh-formatting.yml'
  workflow_dispatch:

jobs:
  validate-formatting:
    name: Validate ZH Bold Formatting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Chinese blog formatting
        run: pnpm run validate:zh-bold-source

      # Later checks run even when an earlier one failed, so one CI round
      # reports everything instead of revealing problems one commit at a time.
      - name: Validate Chinese voice (AI sentence-rhythm drift)
        if: '!cancelled()'
        run: pnpm run validate:zh-voice

      - name: Validate internal cross-links (both locales)
        if: '!cancelled()'
        run: pnpm run validate:internal-links

      - name: Comment on PR with results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const issue_number = context.issue.number;
            const message = `## ⚠️ Blog Checks Failed

            Three checks run here. The job log says which one failed and points at the
            exact lines — start there.

            **Bold formatting**

            \`\`\`bash
            pnpm run validate:zh-bold-source        # report
            pnpm run validate:zh-bold-source:fix    # auto-fix
            \`\`\`

            **Voice (AI sentence-rhythm drift)** — em dashes, 恰恰, overuse of 不是……而是.
            No auto-fix: each hit needs the sentence rewritten, not the character deleted.

            \`\`\`bash
            pnpm run validate:zh-voice
            \`\`\`

            Replacement table: \`.agents/skills/foundation/writing-style/references/zh-voice.md\` (红线三).
            If a hit is deliberate: \`pnpm run validate:zh-voice:update-baseline\`.

            **Internal cross-links** — a link to a slug that doesn't exist (Docusaurus only
            warns on those, so they ship), or a new post that cites nothing from the archive.

            \`\`\`bash
            pnpm run validate:internal-links
            \`\`\`

            For the second one: find the prior posts that argued a point this one leans on
            and link them at that sentence. Don't pad the count. If there is genuinely
            nothing to cite, record why in the post: \`{/* internal-links: none — reason */}\`.

            ### Formatting Rules
            
            1. **Multiple bold on same line**: Must have space before second \`**\`
               \`\`\`markdown
               ✅ 这与 **语法属性（Syntactic Properties）** 形成对比
               ❌ 这与**语法属性（Syntactic Properties）**形成对比
               \`\`\`
            
            2. **Bold with quotes**: Must have spaces inside bold markers
               \`\`\`markdown
               ✅ ** "所有程序行为" ** 是一个语义属性
               ❌ **"所有程序行为"** 是一个语义属性
               \`\`\`
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: message
            });
