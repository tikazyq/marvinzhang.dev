name: Post description inventory and hook fixtures

on:
  pull_request:
    paths:
      - 'docusaurus.config.ts'
      - '.github/workflows/post-description-inventory.yml'
  workflow_dispatch:

jobs:
  inventory-and-build-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Inventory all existing missing descriptions through the blog hook
        run: |
          rm -f /tmp/post-description-inventory.jsonl
          POST_DESCRIPTION_INVENTORY=1 POST_DESCRIPTION_INVENTORY_FILE=/tmp/post-description-inventory.jsonl pnpm run build
          node <<'NODE'
          const fs = require('node:fs');
          const records = fs.readFileSync('/tmp/post-description-inventory.jsonl', 'utf8')
            .trim().split('\n').filter(Boolean).map((line) => JSON.parse(line));
          const inventory = new Map([['en', new Set()], ['zh', new Set()]]);
          for (const record of records) {
            for (const source of record.sources) {
              inventory.get(record.locale).add(source.replace(/^@site\//, ''));
            }
          }
          for (const [locale, paths] of inventory) {
            console.log(`### ${locale === 'en' ? 'English' : 'Chinese'} (${paths.size})`);
            for (const source of [...paths].sort()) console.log(`- ${source}`);
          }
          NODE
      - name: Add real dated-filename fixtures in both locales
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const fixtures = [
            ['blog', '2026-11-26-cutoff-description-fixture.mdx', ''],
            ['blog', '2026-11-27-missing-description-fixture.mdx', ''],
            ['blog', '2026-11-27-blank-description-fixture.mdx', 'description: "   "\n'],
            ['blog', '2026-11-27-valid-description-fixture.mdx', 'description: "Valid fixture description"\n'],
            ['i18n/zh/docusaurus-plugin-content-blog', '2026-11-26-cutoff-description-fixture.mdx', ''],
            ['i18n/zh/docusaurus-plugin-content-blog', '2026-11-27-missing-description-fixture.mdx', ''],
            ['i18n/zh/docusaurus-plugin-content-blog', '2026-11-27-blank-description-fixture.mdx', 'description: "   "\n'],
            ['i18n/zh/docusaurus-plugin-content-blog', '2026-11-27-valid-description-fixture.mdx', 'description: "Valid fixture description"\n'],
          ];
          for (const [directory, filename, extra] of fixtures) {
            fs.writeFileSync(`${directory}/${filename}`, `---\ntitle: Description fixture\n${extra}---\nFixture body.\n`);
          }
          NODE
      - name: Confirm English dated filename rules in normal build
        run: |
          if pnpm run build -- --locale en > /tmp/description-en-failure.log 2>&1; then
            echo 'English build unexpectedly accepted later missing descriptions.'
            exit 1
          fi
          for fixture in 'blog/2026-11-27-missing-description-fixture.mdx' 'blog/2026-11-27-blank-description-fixture.mdx'; do
            if ! grep -F -- "$fixture" /tmp/description-en-failure.log > /dev/null; then
              echo "English build error did not identify $fixture"
              exit 1
            fi
          done
      - name: Confirm Chinese dated filename rules in normal build
        run: |
          if pnpm run build -- --locale zh > /tmp/description-zh-failure.log 2>&1; then
            echo 'Chinese build unexpectedly accepted later missing descriptions.'
            exit 1
          fi
          for fixture in 'i18n/zh/docusaurus-plugin-content-blog/2026-11-27-missing-description-fixture.mdx' 'i18n/zh/docusaurus-plugin-content-blog/2026-11-27-blank-description-fixture.mdx'; do
            if ! grep -F -- "$fixture" /tmp/description-zh-failure.log > /dev/null; then
              echo "Chinese build error did not identify $fixture"
              exit 1
            fi
          done
      - name: Confirm cutoff and valid descriptions pass in both normal builds
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const directory of ['blog', 'i18n/zh/docusaurus-plugin-content-blog']) {
            for (const slug of ['2026-11-27-missing-description-fixture', '2026-11-27-blank-description-fixture']) {
              const file = `${directory}/${slug}.mdx`;
              fs.writeFileSync(file, `---\ntitle: Description fixture\ndescription: "Now valid"\n---\nFixture body.\n`);
            }
          }
          NODE
          pnpm run build -- --locale en
          pnpm run build -- --locale zh
