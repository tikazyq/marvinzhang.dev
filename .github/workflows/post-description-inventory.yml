name: Post description inventory

on:
  pull_request:
    paths:
      - 'plugins/require-post-description/index.js'
      - '.github/workflows/post-description-inventory.yml'
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Exercise cutoff and both locales
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const {findMissingDescriptions} = require('./plugins/require-post-description');
          const root = fs.mkdtempSync(path.join(os.tmpdir(), 'description-check-'));
          const posts = [
            ['blog', 'legacy.mdx', '2026-11-26', ''],
            ['blog', 'next-missing.mdx', '2026-11-27', ''],
            ['blog', 'next-present.mdx', '2026-11-27', 'A description'],
            ['i18n/zh/docusaurus-plugin-content-blog', 'next-missing.mdx', '2026-11-27', ''],
            ['i18n/zh/docusaurus-plugin-content-blog', 'next-whitespace.mdx', '2026-11-27', '   '],
          ];
          for (const [dir, file, date, description] of posts) {
            const target = path.join(root, dir, file);
            fs.mkdirSync(path.dirname(target), {recursive: true});
            fs.writeFileSync(target, `---\ndate: ${date}\n${description ? `description: ${JSON.stringify(description)}\n` : ''}---\n`);
          }
          const found = findMissingDescriptions(root).map(({filePath}) => filePath).sort();
          const expected = [
            'blog/next-missing.mdx',
            'i18n/zh/docusaurus-plugin-content-blog/next-missing.mdx',
            'i18n/zh/docusaurus-plugin-content-blog/next-whitespace.mdx',
          ].sort();
          if (JSON.stringify(found) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected missing-description result: ${JSON.stringify(found)}`);
          }
          fs.rmSync(root, {recursive: true, force: true});
          NODE
      - name: Inventory existing posts missing descriptions
        run: pnpm exec node plugins/require-post-description/index.js --report
