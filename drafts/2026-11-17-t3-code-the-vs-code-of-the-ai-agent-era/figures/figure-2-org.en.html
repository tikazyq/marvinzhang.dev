  .n { font-size:21px; font-weight:600; fill:var(--ink); }
  .s { font-size:18px; fill:var(--soft); }
  .e { font-size:18px; fill:var(--hub); }
  .legend { margin-top:14px; display:flex; flex-wrap:wrap; gap:24px; font-size:18px; color:var(--soft); }
  .legend i { display:inline-block; width:18px; height:18px; border-radius:4px; vertical-align:-3px; margin-right:8px; }
  .footer { margin-top:22px; border-top:1px solid var(--line); padding-top:13px; font-family:'JetBrains Mono',monospace; font-size:18px; color:var(--faint); }
