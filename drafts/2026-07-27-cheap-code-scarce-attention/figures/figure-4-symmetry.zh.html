<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>图 4 — 双刃</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --info-fill: #e1f5fe;  --info-stroke: #01579b;
    --warn-fill: #fff3e0;  --warn-stroke: #e65100;
    --ok-fill:   #e8f5e9;  --ok-stroke:   #2e7d32;
    --hi-fill:   #f3e5f5;  --hi-stroke:   #7b1fa2;
    --err-fill:  #ffebee;  --err-stroke:  #c62828;
    --canvas: #fafafa; --ink: #1f1f1f; --ink-soft: #525252;
    --ink-faint: #8a8a8a; --line: #e0e0e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: 'Inter', 'Noto Sans SC', 'WenQuanYi Zen Hei', -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .canvas { width: 860px; padding: 42px 44px 34px 44px; background: var(--canvas); }
  .header { margin-bottom: 18px; }
  .figno { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: var(--ink-faint); text-transform: uppercase; }
  h1 { font-size: 30px; font-weight: 600; margin: 6px 0 0 0; letter-spacing: -0.005em; line-height: 1.25; }
  .subtitle { font-size: 15.5px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }
  .takeaway { margin-top: 18px; padding: 15px 20px; border-radius: 12px; background: #fff5f5; border-left: 4px solid var(--err-stroke); font-size: 15px; line-height: 1.55; }
  .takeaway b { color: var(--err-stroke); }
  .footer { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 13px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--ink-faint); letter-spacing: 0.06em; text-transform: uppercase; }
  .canvas svg text { font-family: 'Inter', 'Noto Sans SC', 'WenQuanYi Zen Hei', sans-serif; }
  .wrap { border: 1.5px solid var(--line); border-radius: 12px; background: #fff; padding: 10px 8px 6px; }
</style>
</head>
<body>
<div class="canvas">
<div class="header">
  <div class="figno">图 04 — 双刃</div>
  <h1>杠杆是对称的</h1>
  <div class="subtitle">横轴＝杠杆倍数 N，纵轴＝后果。同一个 N，把对的判断往上放大成收益，也把错的判断往下放大成等量的损失——两边张口一样大。</div>
</div>
<div class="wrap">
<svg id="svg" width="772" height="300" viewBox="0 0 772 300"></svg>
</div>
<div class="takeaway"><b>撬动面有多大，翻车面就有多大。</b>杠杆不改变你判断的对错，它只放大后果——一句好规约让整片分支受益，一句写歪的规约让整片分支一起翻车。</div>
<div class="footer"><span style="text-transform:none">收益 / 损失 ＝ ±N · 关于零轴对称</span><span>图 4 / 5</span></div>
</div>
<script>
  const X0=66, X1=612, YC=150, NMAX=10, VMAX=10, YH=118;
  const xm = n => X0 + (n-1)/(NMAX-1)*(X1-X0);
  const ym = v => YC - v/VMAX*YH;
  function line(sign){ let d=''; for(let n=1;n<=NMAX;n+=0.5){ d+=(n===1?'M':'L')+xm(n).toFixed(1)+','+ym(sign*n).toFixed(1); } return d; }
  const g = '#2e7d32', r = '#c62828';
  let s = '';
  // zero axis
  s += `<line x1="${X0}" y1="${YC}" x2="${X1+8}" y2="${YC}" stroke="#8a8a8a" stroke-width="1"/>`;
  s += `<text x="${X1+14}" y="${YC+4}" font-size="11" fill="#8a8a8a">N →</text>`;
  s += `<text x="${X0-8}" y="${YC+4}" font-size="11" fill="#8a8a8a" text-anchor="end">0</text>`;
  // vertical guide at N=10 showing the symmetric opening
  s += `<line x1="${xm(NMAX)}" y1="${ym(VMAX)}" x2="${xm(NMAX)}" y2="${ym(-VMAX)}" stroke="#cfcfcf" stroke-width="1" stroke-dasharray="4 4"/>`;
  s += `<text x="${xm(NMAX)-6}" y="${YC-4}" font-size="11" fill="#a0a0a0" text-anchor="end">同一个 N</text>`;
  // curves
  s += `<path d="${line(1)}" fill="none" stroke="${g}" stroke-width="2.8"/>`;
  s += `<path d="${line(-1)}" fill="none" stroke="${r}" stroke-width="2.8"/>`;
  // end dots
  s += `<circle cx="${xm(NMAX)}" cy="${ym(VMAX)}" r="4" fill="${g}"/>`;
  s += `<circle cx="${xm(NMAX)}" cy="${ym(-VMAX)}" r="4" fill="${r}"/>`;
  // labels on the right
  s += `<rect x="626" y="${ym(VMAX)-18}" width="134" height="52" rx="9" fill="#e8f5e9" stroke="${g}" stroke-width="1.3"/>`;
  s += `<text x="637" y="${ym(VMAX)+2}" font-size="13" font-weight="600" fill="${g}">对的判断</text>`;
  s += `<text x="637" y="${ym(VMAX)+20}" font-size="12" fill="#3f7a44">收益放大 N 倍</text>`;
  s += `<rect x="626" y="${ym(-VMAX)-34}" width="134" height="52" rx="9" fill="#ffebee" stroke="${r}" stroke-width="1.3"/>`;
  s += `<text x="637" y="${ym(-VMAX)-14}" font-size="13" font-weight="600" fill="${r}">错的判断</text>`;
  s += `<text x="637" y="${ym(-VMAX)+4}" font-size="12" fill="#b03535">损失放大 N 倍</text>`;
  // y-axis note
  s += `<text x="${X0-8}" y="${ym(VMAX)+2}" font-size="11" fill="#8a8a8a" text-anchor="end">＋</text>`;
  s += `<text x="${X0-8}" y="${ym(-VMAX)+4}" font-size="11" fill="#8a8a8a" text-anchor="end">−</text>`;
  document.getElementById('svg').innerHTML = s;
</script>
</body>
</html>
