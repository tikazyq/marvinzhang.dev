<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"/><title>图 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#1f1f1f;--soft:#525252;--faint:#7a7a7a;--line:#e0e0e0;--canvas:#fafafa;
--blue:#01579b;--bluef:#e1f5fe;--red:#c62828;--redf:#ffebee;--green:#2e7d32;--greenf:#e8f5e9;--purple:#7b1fa2;--purplef:#f3e5f5;--orange:#e65100;--orangef:#fff3e0;}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}
body{font-family:'Inter','Noto Sans SC',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.canvas{width:760px;padding:40px 44px 30px;background:var(--canvas)}
.figno{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.06em;color:var(--faint)}
h1{font-size:28px;font-weight:700;margin:6px 0 0;line-height:1.3}
.sub{font-size:17px;color:var(--soft);margin-top:8px;line-height:1.5}
.panel{margin-top:22px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:16px 18px}
.panel h2{margin:0 0 4px;font-size:19px;font-weight:700}
.note{font-size:16px;color:var(--soft);line-height:1.5;margin-top:8px}
.take{margin-top:20px;padding:14px 18px;border-radius:12px;background:#fffdf0;border-left:4px solid var(--blue);font-size:17px;line-height:1.55}
.foot{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--faint)}
svg{display:block}

.shotwrap{position:relative;overflow:hidden;border-radius:14px;border:1.5px solid #d0d0d0;background:#111827}
.shotwrap img{position:absolute;left:0;display:block}
.box{position:absolute;border:2.5px solid;border-radius:8px}
.badge{position:absolute;width:28px;height:28px;border-radius:50%;color:#fff;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif}
.cols{display:flex;gap:22px;margin-top:22px}
.col{flex:1}
.cap{font-size:17px;font-weight:700;margin-bottom:8px}
.legend{margin-top:12px;font-size:16px;line-height:1.5;color:var(--soft)}
.legend div{display:flex;gap:8px;margin-top:6px}
.legend i{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-style:normal;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.side{flex:1;position:relative}
.tag{position:absolute;left:0;right:0;padding:10px 14px;border-radius:10px;font-size:16px;line-height:1.45;background:#fff;border:1.5px solid}
.tag b{font-size:17px}
.brk{position:absolute;left:-14px;width:10px;border:2.5px solid #c62828;border-right:none;border-radius:6px 0 0 6px}

</style></head><body><div class="canvas">

<div class="cols">

<div class="col"><div class="cap" style="color:#01579b">Semon PM 的对话</div><div class="shotwrap" style="width:322px;height:478px"><img src="shots/semon-to-cpm.png" style="width:322px;top:-2.1px"/><div class="box" style="left:6px;right:6px;top:1.4px;height:30.0px;border-color:#7b1fa2"></div><div class="badge" style="right:-2px;top:4.0px;background:#7b1fa2">3</div><div class="box" style="left:6px;right:6px;top:80.8px;height:69.7px;border-color:#01579b"></div><div class="badge" style="right:-2px;top:68.8px;background:#01579b">4</div></div>
<div class="legend"><div><i style="background:#7b1fa2">3</i>收到的消息标着 Agent：Chief PM 转达了我的意思</div>
<div><i style="background:#01579b">4</i>调研做完，结论直接发回 Chief PM</div></div></div>
</div>
<div class="foot">截图：T3 Code iOS · 12:27 / 12:28</div></div></body></html>
